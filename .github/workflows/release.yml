name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build DMG and Publish Release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build DMG
        run: make dmg

      - name: Verify DMG
        run: hdiutil verify dist/Breathlet.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/Breathlet.dmg --clobber
          else
            gh release create "$TAG_NAME" dist/Breathlet.dmg \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Publish to here.now (on tag)
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          SLUG: emerald-globe-xmny
          RELEASE_BASE_URL: https://emerald-globe-xmny.here.now
        run: |
          set -euo pipefail
          if [ -z "${HERENOW_API_KEY:-}" ]; then
            echo "⚠️ 未配置 HERENOW_API_KEY secret，跳过 here.now 发布（GitHub Release 已生成）。"
            echo "   在仓库 Settings → Secrets and variables → Actions 添加 HERENOW_API_KEY 后，重跑本 job 即可自动发布。"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "发布版本：${VERSION}"
          chmod +x scripts/publish_release.sh scripts/herenow/publish.sh
          bash scripts/publish_release.sh dist/Breathlet.dmg "${VERSION}"
